name: funcd release

# release-please keeps a release PR open on funcd-ui. Merging it tags funcd-rauthy-v<version> and
# publishes ghcr.io/pyvvo/funcd-rauthy:<version>, built here by funcd/image/build.sh, the script
# local builds use.
on:
  push:
    branches:
      - funcd-ui

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A PR opened with GITHUB_TOKEN triggers no workflows. A token from the funcd release
      # GitHub App does; until the app is configured, release-please falls back to GITHUB_TOKEN.
      - id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          target-branch: funcd-ui
          config-file: funcd/release-please-config.json
          manifest-file: funcd/.release-please-manifest.json

  publish-image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # The full-LTO link of the release profile peaks near 7.5 GiB, so swap keeps it from being
      # killed on a smaller runner; the builder image and both targets need the disk.
      - name: Make room for the release build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo fallocate -l 16G /mnt/funcd-swap
          sudo chmod 600 /mnt/funcd-swap
          sudo mkswap /mnt/funcd-swap
          sudo swapon /mnt/funcd-swap
          free -h
          df -h / /mnt

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and push the image
        env:
          TAG: ${{ needs.release-please.outputs.version }}
        run: funcd/image/build.sh --push
